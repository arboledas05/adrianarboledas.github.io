<figure class="world hero-visual" data-world="hero"{{if ui.w.hero.fig}} aria-labelledby="fig-hero"{{/if}}>
  <div class="world-slot" data-world-slot="hero" style="--ar:1/1.08">
    <div class="slot-fallback">
      <picture>
        <source media="(max-width: 820px)" srcset="{{asset img/worlds/hero-m-@lang.webp}}" width="600" height="648">
        <img class="hero-poster" src="{{asset img/worlds/hero-d-@lang.webp}}" width="1000" height="1080" alt="" decoding="async">
      </picture>
    </div>
    <picture class="hero-portrait">
      <source media="(max-width: 820px)" srcset="{{asset img/adrian-cutout-480.webp}}" width="480" height="410">
      <img src="{{asset img/adrian-cutout-760.webp}}" width="760" height="649" alt="Adrián Arboledas" fetchpriority="high" decoding="async">
    </picture>
    <span class="hero-bead" aria-hidden="true"></span>
    <div class="slot-ui">
      <span class="hs" data-hotspot="build" aria-hidden="true">{{t ui.w.hero.h0}}</span>
      <span class="hs" data-hotspot="deploy" aria-hidden="true">{{t ui.w.hero.h1}}</span>
      <span class="hs" data-hotspot="grow" aria-hidden="true">{{t ui.w.hero.h2}}</span>
      <span class="hs" data-hotspot="drone" aria-hidden="true">{{t ui.w.hero.h3}}</span>
      <span class="hs" data-hotspot="europe" aria-hidden="true">{{t ui.w.hero.h4}}</span>
    </div>
    <div class="slot-hit" data-cursor="open" aria-hidden="true"></div>
  </div>
  <figcaption class="world-cap"><span class="fig-n">FIG. 00</span> {{if ui.w.hero.fig}}<span class="fig-name" id="fig-hero">{{t ui.w.hero.fig}}</span> {{/if}}{{if ui.w.hero.hint}}<span class="fig-hint">{{t ui.w.hero.hint}}</span> {{/if}}<button type="button" class="fig-pause" aria-pressed="false">{{t ui.w.pause}}</button> <span class="fig-mode">{{t ui.w.mode2d}}</span></figcaption>
</figure>
